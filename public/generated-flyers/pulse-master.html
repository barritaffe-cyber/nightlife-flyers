<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pulse Sunday — CSS Master</title>
<style>
@font-face{font-family:PulseBold;src:url('/fonts/LEMONMILK-Bold.ttf')}@font-face{font-family:PulseLight;src:url('/fonts/LEMONMILK-Light.ttf')}
*{box-sizing:border-box}html,body{margin:0;background:#1b191a}body{display:grid;place-items:center}.canvas{position:relative;width:1080px;height:1920px;overflow:hidden;background:#1b191a;color:#fff}.canvas>*{position:absolute}.background{inset:0;width:100%;height:100%;object-fit:cover}.shade{inset:0;background:linear-gradient(180deg,transparent 48%,rgba(27,25,26,.15) 62%,#1b191a 82%);z-index:1}
.text{z-index:4;white-space:nowrap;margin:0;text-align:center;line-height:1}.pulse{z-index:6;left:30%;top:68.5%;width:40%;font:86px/1 'Times New Roman',serif;letter-spacing:.19em;text-shadow:0 0 4px #fff,0 0 10px #aaa}.headline{left:19%;top:73.3%;width:62%;font:150px/1 PulseBold,sans-serif;letter-spacing:-.035em;color:transparent;background:linear-gradient(100deg,#3c91c7 0%,#e53491 25%,#ef9450 47%,#e72e86 78%,#3079a2 100%);background-clip:text;-webkit-background-clip:text}.ghost{left:19%;width:62%;font:150px/1 PulseBold,sans-serif;letter-spacing:-.035em;color:transparent;-webkit-text-stroke:1px #777;opacity:.22;z-index:2}.ghost-one{top:81%}.ghost-two{top:88.5%;opacity:.08}.day{left:81%;top:25%;width:12%;font:96px/1 PulseBold,sans-serif;text-shadow:0 0 4px #fff}.weekday,.month{top:31.3%;font:40px/1 PulseLight,sans-serif;color:#c6c3c4;width:9%;transform:rotate(-90deg)}.weekday{left:79.3%}.month{left:84.4%}.banner{left:30.3%;top:82.8%;width:39.4%;height:2.6%;background:#b11196;z-index:3}.offer{left:30.3%;top:83%;width:39.4%;font:38px/1.1 PulseBold,sans-serif;letter-spacing:.12em}.details{left:23%;top:85.9%;width:54%;font:42px/1.05 'Times New Roman',serif}.rsvp{left:17%;top:90.7%;width:66%;font:25px/1.2 PulseBold,sans-serif;letter-spacing:.07em}.address{left:17%;top:92.4%;width:66%;font:16px/1.2 Arial,sans-serif}.terms{left:34%;top:97.2%;width:32%;font:20px/1 PulseLight,sans-serif;letter-spacing:.55em;color:#aaa}
.canvas[data-format=square]{height:1080px}.canvas[data-format=square] .shade{background:linear-gradient(180deg,transparent 38%,rgba(27,25,26,.08) 48%,#1b191a 80%)}.canvas[data-format=square] .pulse{top:59%;font-size:68px}.canvas[data-format=square] .headline{top:65%;font-size:142px}.canvas[data-format=square] .day{top:11%;left:82%;font-size:79px}.canvas[data-format=square] .weekday,.canvas[data-format=square] .month{top:21%;font-size:29px}.canvas[data-format=square] .banner{top:79%;height:4.4%}.canvas[data-format=square] .offer{top:79.3%;font-size:34px}.canvas[data-format=square] .details{top:84%;font-size:34px}.canvas[data-format=square] .rsvp{top:90%;font-size:22px}.canvas[data-format=square] .address{top:93%;font-size:15px}.canvas[data-format=square] .terms{top:97%;font-size:15px}.canvas[data-format=square] .ghost-one{top:77%;font-size:142px}.canvas[data-format=square] .ghost-two{top:90%;font-size:142px}
</style></head><body><main class="canvas" data-coco-canvas data-format="story">
<img class="background" data-region="background" data-coco-object="background" data-coco-role="background" src="/generated-flyers/assets/pulse-story-bg.png" alt="Neon pink statue and distressed wire background">
<div class="shade" data-region="shade" data-coco-object="shade"></div>
<div class="text day" data-region="day" data-coco-object="day" data-coco-role="day" data-coco-editable="true">14</div>
<div class="text weekday" data-region="weekday" data-coco-object="weekday" data-coco-role="weekday" data-coco-editable="true">SUN</div>
<div class="text month" data-region="month" data-coco-object="month" data-coco-role="month" data-coco-editable="true">SEP</div>
<div class="text pulse" data-region="pulse" data-coco-object="pulse" data-coco-role="headline2" data-coco-editable="true">PULSE</div>
<div class="text headline" data-region="headline" data-coco-object="headline" data-coco-role="headline" data-coco-editable="true">SUNDAY</div>
<div class="text ghost ghost-one" data-region="ghost-one" data-coco-object="ghost-one">SUNDAY</div><div class="text ghost ghost-two" data-region="ghost-two" data-coco-object="ghost-two">SUNDAY</div>
<div class="banner" data-region="banner" data-coco-object="banner"></div>
<div class="text offer" data-region="offer" data-coco-object="offer" data-coco-role="price" data-coco-editable="true">ENJOY 15% OFF</div>
<div class="text details" data-region="details" data-coco-object="details" data-coco-role="details" data-coco-editable="true">ON ALL MENU ITEMS</div>
<div class="text rsvp" data-region="rsvp" data-coco-object="rsvp" data-coco-role="rsvp" data-coco-editable="true">FOR RESERVATIONS : +971 50 836 2445</div>
<div class="text address" data-region="address" data-coco-object="address" data-coco-role="address" data-coco-editable="true">CONCORDE CREEK VIEW HOTEL, GROUND FLOOR, AL SEEF, ABRA, BUR DUBAI</div>
<div class="text terms" data-region="terms" data-coco-object="terms" data-coco-role="subtag" data-coco-editable="true">* T &amp; C APPLY</div>
</main><script>const format=new URLSearchParams(location.search).get('format')==='square'?'square':'story';document.querySelector('.canvas').dataset.format=format;document.querySelector('.background').src='/generated-flyers/assets/pulse-'+format+'-bg.png';</script></body></html>
