  <title>Neon Night Shift — reference CSS master</title>
  <style>
    @font-face { font-family: "Anton"; src: url("../fonts/Anton.ttf") format("truetype"); font-display: block; }
    @font-face { font-family: "Bebas Neue"; src: url("../fonts/BebasNeue-Regular.ttf") format("truetype"); font-display: block; }
    @font-face { font-family: "Open Script"; src: url("../fonts/OpenScript.ttf") format("truetype"); font-display: block; }
    @font-face { font-family: "Lemon Milk"; src: url("../fonts/LEMONMILK-Regular.ttf") format("truetype"); font-display: block; }
    @font-face { font-family: "Lemon Milk"; src: url("../fonts/LEMONMILK-Bold.ttf") format("truetype"); font-weight: 800; font-display: block; }

    :root {
      --canvas-width: 1080px;
      --canvas-height: 1920px;
      --black: #020305;
      --paper: #f2f0ed;
      --pink: #f50087;
      --pink-deep: #780039;
      --cyan: #00d9e9;
      --cyan-deep: #003f49;
    }

    * { box-sizing: border-box; }
    html, body { width: var(--canvas-width); height: var(--canvas-height); margin: 0; overflow: hidden; background: var(--black); }
    body { font-family: "Lemon Milk", Arial, sans-serif; }
    .flyer { position: relative; isolation: isolate; width: 100%; height: 100%; overflow: hidden; color: var(--paper); background: #020305; }

    .wet-wall {
      position: absolute; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 16% 18%, rgba(245,0,135,.28), transparent 34%),
        radial-gradient(ellipse at 74% 31%, rgba(0,217,233,.18), transparent 25%),
        linear-gradient(90deg, rgba(108,0,48,.72) 0 37.5%, rgba(2,3,5,.96) 37.5% 100%),
        #020305;
    }
    .wet-wall::before {
      content: ""; position: absolute; inset: 0; opacity: .58; mix-blend-mode: screen;
      background-image:
        radial-gradient(ellipse at center, rgba(255,255,255,.18) 0 1px, transparent 2px),
        linear-gradient(102deg, transparent 0 48%, rgba(255,255,255,.08) 49%, transparent 51%);
      background-size: 17px 29px, 73px 91px;
      filter: blur(.3px);
    }
    .left-panel { position: absolute; left: 0; top: 0; width: 38.5%; height: 78%; z-index: 1; background: linear-gradient(180deg, rgba(111,0,46,.42), rgba(70,0,37,.2)); border-right: 2px solid rgba(245,0,135,.1); }
    .bottom-wash { position: absolute; left: 0; bottom: 0; width: 100%; height: 34%; z-index: 2; background: linear-gradient(180deg, transparent, rgba(0,0,0,.9) 26%, #010203 72%); }
    .edge-paint { position: absolute; z-index: 3; filter: saturate(1.4); opacity: .78; }
    .edge-paint.left { left: -3%; bottom: 0; width: 25%; height: 31%; background: radial-gradient(ellipse at 55% 80%, rgba(0,217,233,.56), transparent 54%), linear-gradient(112deg, rgba(245,0,135,.4), transparent 64%); clip-path: polygon(0 0,65% 6%,83% 29%,63% 54%,92% 77%,66% 100%,0 100%); }
    .edge-paint.right { right: -3%; bottom: 0; width: 24%; height: 33%; background: radial-gradient(ellipse at 42% 65%, rgba(0,217,233,.58), transparent 55%), linear-gradient(250deg, rgba(245,0,135,.42), transparent 58%); clip-path: polygon(28% 0,100% 7%,100% 100%,22% 100%,41% 78%,14% 55%,34% 29%); }

    .portrait-disc { position: absolute; left: 10.5%; top: 27.2%; width: 80%; aspect-ratio: 1; z-index: 4; border-radius: 50%; overflow: hidden; background: linear-gradient(112deg, #e9e8e3 0 38%, #e9007e 39% 58%, #01dce9 59% 100%); box-shadow: 0 0 50px rgba(0,217,233,.22); }
    .portrait-disc::before { content: ""; position: absolute; inset: 0; opacity: .38; background: repeating-radial-gradient(circle at 24% 42%, transparent 0 13px, rgba(0,0,0,.36) 14px 18px), linear-gradient(120deg, transparent 0 44%, rgba(0,0,0,.35) 45% 62%, transparent 63%); transform: scale(1.2) rotate(-8deg); }
    .portrait { position: absolute; left: 10%; top: 13.5%; width: 80%; height: 64%; z-index: 7; object-fit: contain; object-position: 50% 50%; filter: contrast(1.08) saturate(.94) drop-shadow(0 24px 22px rgba(0,0,0,.68)); }
    .portrait-grade { position: absolute; left: 8%; top: 13%; width: 84%; height: 65%; z-index: 8; pointer-events: none; background: linear-gradient(98deg, rgba(245,0,135,.28), transparent 45%, rgba(0,217,233,.2)); mix-blend-mode: color; mask-image: radial-gradient(ellipse at 50% 48%, #000 0 52%, transparent 73%); }

    .date { position: absolute; left: 14.8%; top: 11.5%; width: 17%; height: 15%; z-index: 15; text-transform: uppercase; font-family: "Bebas Neue", sans-serif; line-height: .78; }
    .date .weekday { display: block; font-family: "Lemon Milk"; font-size: 48px; font-weight: 800; letter-spacing: .02em; line-height: 1; }
    .date .month { display: block; color: var(--pink); font-family: "Lemon Milk"; font-size: 43px; font-weight: 800; line-height: 1; }
    .date .day { display: block; margin-top: 6px; font-size: 135px; letter-spacing: -.03em; }
    .doors { position: absolute; left: 14.6%; top: 24.7%; width: 18%; z-index: 15; padding: 13px 0 12px; border-top: 3px solid var(--pink); border-bottom: 3px solid var(--pink); font-size: 25px; line-height: 1.03; text-transform: uppercase; }
    .doors b { display: block; color: var(--pink); font-size: 21px; }

    .compliance { position: absolute; right: 10.7%; top: 4.8%; z-index: 15; text-align: center; text-transform: uppercase; font-size: 22px; line-height: 1.08; }
    .compliance b { display: block; font-size: 40px; }
    .manifesto { position: absolute; right: 8.3%; top: 25.1%; z-index: 15; width: 14%; padding: 16px 0; border-top: 4px solid var(--cyan); border-bottom: 4px solid var(--cyan); font-size: 25px; font-weight: 800; line-height: 1.5; text-transform: uppercase; }
    .manifesto span { display: block; }
    .manifesto .cyan { color: var(--cyan); }

    .headline { position: absolute; left: 5.4%; top: 44.2%; width: 61%; height: 20%; z-index: 20; font-family: "Anton", "Bebas Neue", sans-serif; font-size: 355px; line-height: .78; letter-spacing: -.055em; text-transform: uppercase; color: var(--paper); text-shadow: 0 6px 0 rgba(0,0,0,.28); }
    .headline::after { content: ""; position: absolute; inset: 4% 1% 8%; opacity: .16; mix-blend-mode: multiply; background: repeating-linear-gradient(168deg, transparent 0 8px, #000 9px 11px); pointer-events: none; }
    .script { position: absolute; left: 43%; top: 55.2%; width: 49%; height: 10%; z-index: 23; color: var(--pink); font-family: "Open Script", cursive; font-size: 165px; line-height: .8; transform: rotate(-7deg); text-shadow: 0 6px 18px rgba(0,0,0,.72); white-space: nowrap; }
    .script-underline { position: absolute; left: 36%; top: 65.5%; width: 57%; height: 2.5%; z-index: 22; transform: rotate(-7deg); }
    .script-underline path { fill: var(--pink); }

    .triangle { position: absolute; width: 0; height: 0; z-index: 16; border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 42px solid var(--pink); transform: rotate(26deg); }
    .triangle.top { left: 65%; top: 9.4%; }
    .triangle.bottom { right: 13%; top: 68%; border-bottom-color: var(--cyan); transform: rotate(165deg); }

    .footer-grid { position: absolute; left: 25.6%; top: 77.4%; width: 52.5%; height: 8.8%; z-index: 25; display: grid; grid-template-columns: 1fr 1px 1fr; gap: 38px; }
    .footer-grid .rule { background: var(--paper); opacity: .9; }
    .footer-card { position: relative; padding-top: 50px; font-size: 29px; line-height: 1.08; text-transform: uppercase; }
    .footer-card .tag { position: absolute; top: 0; left: 0; padding: 7px 10px 5px; color: #08090a; font-size: 19px; font-weight: 800; line-height: 1; background: var(--pink); }
    .footer-card.vip .tag { background: var(--cyan); }
    .footer-card.vip::after { content: ""; position: absolute; left: 0; bottom: -18px; width: 52%; height: 3px; background: var(--cyan); }

    .contact { position: absolute; left: 33.5%; top: 87.2%; width: 33%; z-index: 25; border: 2px solid rgba(245,0,135,.62); padding: 26px 20px 12px; color: var(--paper); font-size: 25px; letter-spacing: .34em; text-align: center; }
    .contact .label { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); padding: 0 14px; color: var(--pink); background: var(--black); font-size: 17px; font-weight: 800; letter-spacing: .14em; white-space: nowrap; text-transform: uppercase; }
    .venue { position: absolute; left: 22%; top: 93.5%; width: 56%; z-index: 25; text-align: center; text-transform: uppercase; }
    .venue .pin { display: block; margin: 0 auto 8px; width: 23px; height: 30px; border: 2px solid var(--pink); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
    .venue .address { display: block; font-size: 20px; letter-spacing: .16em; }
    .venue .dress { display: block; margin-top: 12px; color: var(--cyan); font-size: 17px; letter-spacing: .45em; }

    .photo-chip { position: absolute; right: 4.6%; top: 74.2%; width: 19%; height: 25.8%; z-index: 5; overflow: hidden; opacity: .62; background: linear-gradient(145deg, rgba(245,0,135,.55), rgba(0,0,0,.2)), url("../scene-assets/ladies-night-pink-chrokme/background.jpg") center / cover; clip-path: polygon(0 4%,100% 0,100% 100%,8% 100%); }
