<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<defs>
 <linearGradient id="base" x1="0" y1="0" x2=".42" y2="1"><stop stop-color="#ffec48"/><stop offset=".35" stop-color="#ffc51c"/><stop offset=".66" stop-color="#f68a0c"/><stop offset="1" stop-color="#ed670c"/></linearGradient>
 <radialGradient id="sun" cx=".28" cy=".07" r=".53"><stop stop-color="#fff58a" stop-opacity=".95"/><stop offset=".35" stop-color="#ffea40" stop-opacity=".65"/><stop offset="1" stop-color="#ffd221" stop-opacity="0"/></radialGradient>
 <linearGradient id="copper" x1="0" y1="0" x2="1" y2=".45"><stop offset=".42" stop-color="#ef4114" stop-opacity="0"/><stop offset="1" stop-color="#e94727" stop-opacity=".8"/></linearGradient>
 <filter id="relief" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency=".07 .09" numOctaves="3" seed="24" result="coarse"/>
  <feDiffuseLighting in="coarse" surfaceScale="1.25" diffuseConstant="1.2" lighting-color="#fff" result="ridges"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
  <feComponentTransfer in="ridges" result="softRidges"><feFuncR type="linear" slope=".32" intercept=".68"/><feFuncG type="linear" slope=".32" intercept=".68"/><feFuncB type="linear" slope=".32" intercept=".68"/></feComponentTransfer>
  <feBlend in="SourceGraphic" in2="softRidges" mode="multiply" result="raised"/>
  <feTurbulence type="fractalNoise" baseFrequency=".37" numOctaves="2" seed="8" result="fine"/>
  <feDiffuseLighting in="fine" surfaceScale=".7" diffuseConstant="1.22" lighting-color="#fff" result="grain"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting>
  <feBlend in="raised" in2="grain" mode="multiply" result="material"/>
  <feSpecularLighting in="coarse" surfaceScale="1.7" specularConstant=".55" specularExponent="12" lighting-color="#fff0b1" result="sheen"><feDistantLight azimuth="225" elevation="55"/></feSpecularLighting>
  <feComposite in="sheen" in2="material" operator="arithmetic" k1="0" k2=".38" k3="1" k4="0"/>
 </filter>
</defs>
<g filter="url(#relief)"><path fill="url(#base)" d="M0 0h900v300H0z"/><path fill="url(#copper)" d="M0 0h900v300H0z"/><path fill="url(#sun)" d="M0 0h900v300H0z"/></g>
</svg>
