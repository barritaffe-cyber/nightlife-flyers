<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch" seed="8" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#eee5cc" surfaceScale="1.8" diffuseConstant="1.1"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#e5dbc0"/>
  <rect width="256" height="256" filter="url(#paper)" opacity=".65"/>
</svg>
