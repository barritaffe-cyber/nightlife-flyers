<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Black Gold Party — Coco CSS Master</title>
  <style>
    @font-face { font-family: GoldDisplay; src: url("/fonts/Anton.ttf") format("truetype"); font-weight: 400 900; font-display: block; }
    @font-face { font-family: GoldCondensed; src: url("/fonts/BebasNeue-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: GoldSans; src: url("/fonts/LEMONMILK-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
    @font-face { font-family: GoldSansBold; src: url("/fonts/LEMONMILK-Bold.ttf") format("truetype"); font-weight: 700 900; font-display: block; }
    @font-face { font-family: GoldBrush; src: url("/fonts/script/Good Brush.otf") format("opentype"); font-weight: 400 900; font-display: block; }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background-color: #020608; }
    body { display: grid; place-items: center; padding: 24px; }

    .canvas {
      --gold: #f7bb28;
      --gold-light: #fff0a3;
      --gold-dark: #8d4d00;
      --ink: #02080a;
      position: relative;
      width: min(92vw, 540px);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      isolation: isolate;
      container-type: inline-size;
      color: #f7d99a;
      background-color: var(--ink);
      background-image:
        radial-gradient(ellipse at 68% 14%, rgba(137,52,17,.22) 0%, rgba(1,7,9,0) 34%),
        radial-gradient(ellipse at 22% 48%, rgba(15,56,61,.25) 0%, rgba(1,7,9,0) 36%),
        radial-gradient(ellipse at 53% 76%, rgba(36,47,39,.18) 0%, rgba(1,7,9,0) 38%),
        linear-gradient(115deg, #02090c 0%, #05090a 47%, #120909 100%);
      box-shadow: 0 34px 100px rgba(0,0,0,.86);
      font-family: GoldSans, sans-serif;
    }
    .canvas[data-format="square"] { aspect-ratio: 1; }
    .canvas[data-format="story"] { aspect-ratio: 9 / 16; }

    .background, .ambience, .constellations, .smoke, .grain, .edge-bar, .portrait-frame, .date-medallion {
      position: absolute;
    }
    .background {
      inset: 0;
      z-index: -30;
      background-color: var(--ink);
      background-image:
        radial-gradient(ellipse at 68% 14%, rgba(137,52,17,.22) 0%, rgba(1,7,9,0) 34%),
        radial-gradient(ellipse at 22% 48%, rgba(15,56,61,.25) 0%, rgba(1,7,9,0) 36%),
        radial-gradient(ellipse at 53% 76%, rgba(36,47,39,.18) 0%, rgba(1,7,9,0) 38%),
        linear-gradient(115deg, #02090c 0%, #05090a 47%, #120909 100%);
    }
    .ambience {
      inset: 0;
      z-index: -20;
      background-color: transparent;
      background-image:
        radial-gradient(circle at 30% 30%, rgba(255,171,20,.22) 0 .4%, transparent 1.8%),
        radial-gradient(circle at 70% 35%, rgba(255,111,18,.32) 0 .45%, transparent 2%),
        radial-gradient(circle at 29% 57%, rgba(255,143,20,.32) 0 .45%, transparent 2%),
        radial-gradient(circle at 66% 48%, rgba(255,127,22,.28) 0 .4%, transparent 2.1%),
        radial-gradient(ellipse at 51% 51%, rgba(231,147,32,.12), transparent 45%);
    }
    .constellations {
      inset: -3%;
      z-index: -16;
      opacity: .32;
      background-color: transparent;
      background-image:
        linear-gradient(31deg, transparent 0 30%, rgba(230,153,31,.8) 30.15% 30.28%, transparent 30.43% 100%),
        linear-gradient(145deg, transparent 0 64%, rgba(230,153,31,.68) 64.1% 64.22%, transparent 64.35% 100%),
        linear-gradient(75deg, transparent 0 76%, rgba(230,153,31,.55) 76.1% 76.22%, transparent 76.35% 100%),
        radial-gradient(circle at 22% 13%, #ffc24d 0 .38%, transparent .52%),
        radial-gradient(circle at 14% 25%, #ffc24d 0 .33%, transparent .47%),
        radial-gradient(circle at 86% 14%, #ffc24d 0 .34%, transparent .48%),
        radial-gradient(circle at 81% 84%, #ffc24d 0 .34%, transparent .48%),
        radial-gradient(circle at 17% 86%, #ffc24d 0 .34%, transparent .48%);
    }
    .smoke {
      left: 22%; top: 48%; width: 57%; height: 28%;
      z-index: 9;
      opacity: .42;
      filter: blur(15px);
      border-radius: 50%;
      background-color: transparent;
      background-image:
        radial-gradient(ellipse at 24% 62%, rgba(186,182,168,.37) 0 6%, transparent 34%),
        radial-gradient(ellipse at 54% 69%, rgba(173,169,160,.28) 0 8%, transparent 35%),
        radial-gradient(ellipse at 81% 45%, rgba(137,130,119,.24) 0 6%, transparent 31%);
    }
    .edge-bar {
      z-index: 4;
      width: 4.8%;
      height: 18.5%;
      top: 40.8%;
      background-color: var(--gold);
      background-image: linear-gradient(100deg, #8b4d00 0%, #ffd45b 18%, #fff0a3 38%, #c97d00 67%, #ffcb3e 100%);
      box-shadow: inset 0 0 1.3cqw rgba(255,255,255,.32), 0 0 2cqw rgba(244,159,24,.2);
    }
    .edge-bar.left { left: -1.3%; }
    .edge-bar.right { right: -1.3%; top: 31.5%; }

    .portrait-frame {
      left: 30.65%; top: 9.1%; width: 38.7%; height: 58.7%;
      z-index: 12;
      overflow: visible;
      filter: drop-shadow(0 0 1.8cqw rgba(255,164,18,.38));
    }
    .subject {
      position: absolute;
      left: 22.8%; top: 16.4%; width: 54.4%; height: 49.8%;
      z-index: 18;
      object-fit: contain;
      object-position: 50% 100%;
      filter: contrast(1.08) saturate(1.08) drop-shadow(0 1.4cqw 1.7cqw rgba(0,0,0,.85));
    }
    .shards {
      position: absolute;
      left: 40%; top: 3.8%; width: 47%; height: 31%;
      z-index: 25;
      object-fit: contain;
      object-position: 50% 50%;
      opacity: .92;
      filter: contrast(1.25) brightness(1.12) drop-shadow(0 .5cqw .7cqw rgba(0,0,0,.85));
    }

    .presenter {
      position: absolute;
      z-index: 40;
      left: 22%; top: 4.65%; width: 56%;
      color: #f4dca6;
      font: 400 1.42cqw/1 GoldCondensed, sans-serif;
      letter-spacing: .47em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 .2cqw .35cqw #000;
    }
    .metallic-text {
      color: transparent;
      background-color: transparent;
      background-image: linear-gradient(105deg, #804600 0%, #ffc331 16%, #fff1a2 31%, #c87600 53%, #ffe275 70%, #9e5200 86%, #ffc636 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(.13cqw .33cqw .08cqw rgba(24,10,0,.9)) drop-shadow(0 0 .45cqw rgba(255,168,20,.28));
    }
    .headline, .headline2 {
      position: absolute;
      z-index: 33;
      width: 43%;
      font-family: GoldSansBold, sans-serif;
      font-size: 9.6cqw;
      font-weight: 900;
      line-height: .82;
      letter-spacing: -.055em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .headline { left: 2.2%; top: 37.2%; transform: rotate(-90deg); }
    .headline2 { right: -1.6%; top: 38.2%; transform: rotate(90deg); }

    .date-medallion {
      right: 8.8%; top: 16.25%; width: 18.2%; aspect-ratio: 1;
      z-index: 29;
      border-radius: 50%;
      background-color: #f5a900;
      background-image:
        repeating-radial-gradient(circle at 36% 34%, rgba(255,248,173,.55) 0 .17cqw, transparent .2cqw .48cqw),
        radial-gradient(circle at 34% 25%, #fff0a1, #f6b000 47%, #a85b00 100%);
      box-shadow: 0 0 2.4cqw rgba(255,169,18,.48), inset 0 0 1cqw rgba(255,255,255,.45);
      transform: rotate(-5deg);
    }
    .date {
      position: absolute;
      z-index: 42;
      right: 8.5%; top: 18.15%; width: 18.8%;
      color: #080808;
      font-family: GoldDisplay, sans-serif;
      font-size: 4.4cqw;
      font-weight: 900;
      line-height: .78;
      text-align: center;
      text-transform: uppercase;
      white-space: normal;
      transform: rotate(-5deg);
      text-shadow: none;
    }
    .date .month { display: inline-block; font-family: GoldCondensed, sans-serif; font-size: .62em; line-height: 1; transform: rotate(-90deg) translateY(.12em); }
    .date .day { display: inline-block; font-size: 2.05em; line-height: .75; letter-spacing: -.08em; }

    .party {
      position: absolute;
      z-index: 46;
      left: 30%; top: 67.1%; width: 40%;
      color: transparent;
      font-family: GoldBrush, cursive;
      font-size: 8.75cqw;
      font-weight: 900;
      line-height: .72;
      letter-spacing: -.08em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      transform: rotate(-6deg) scaleX(1.18);
      background-color: transparent;
      background-image: linear-gradient(106deg, #8c4f00 0%, #fff29d 20%, #f9bd21 45%, #fff0a0 59%, #b45a00 82%, #ffbe27 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(.23cqw .52cqw .12cqw #1b0b00) drop-shadow(0 0 .5cqw rgba(255,171,15,.34));
    }

    .venue, .dj-lineup, .fine-print {
      position: absolute;
      z-index: 43;
      left: 20%; width: 60%;
      color: #e7b956;
      font-family: GoldCondensed, sans-serif;
      text-align: center;
      text-transform: uppercase;
      text-shadow: .1cqw .24cqw .12cqw #000;
    }
    .venue { top: 82.2%; font-size: 2.2cqw; line-height: 1; }
    .dj-lineup { top: 85.7%; font-size: 2.05cqw; line-height: 1; }
    .fine-print { top: 89%; display: flex; align-items: center; justify-content: center; gap: .55cqw; font-size: 1.43cqw; line-height: 1; white-space: nowrap; }
    .fine-print > span { display: inline-block; }
    .fine-print .separator { color: #9f6b14; }

    .brand-row {
      position: absolute;
      z-index: 42;
      left: 20%; top: 93.15%; width: 60%; height: 4.3%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      gap: 5%;
    }
    .brand {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      opacity: .9;
    }
    .brand.two { transform: rotate(-5deg); }

    .grain {
      inset: 0;
      z-index: 90;
      opacity: .1;
      pointer-events: none;
      mix-blend-mode: screen;
      background-color: transparent;
      background-image:
        repeating-linear-gradient(87deg, transparent 0 4px, rgba(255,255,255,.07) 5px, transparent 6px 11px),
        repeating-linear-gradient(2deg, transparent 0 6px, rgba(244,185,72,.045) 7px, transparent 8px 13px);
    }

    .canvas[data-format="square"] .presenter { top: 3.1%; font-size: 1.32cqw; }
    .canvas[data-format="square"] .portrait-frame { left: 31%; top: 9%; width: 38%; height: 61%; }
    .canvas[data-format="square"] .subject { left: 23%; top: 15%; width: 54%; height: 54%; }
    .canvas[data-format="square"] .shards { left: 42%; top: 1%; width: 44%; height: 34%; }
    .canvas[data-format="square"] .headline { left: .5%; top: 37%; }
    .canvas[data-format="square"] .headline2 { right: -1%; top: 38%; }
    .canvas[data-format="square"] .date-medallion { right: 6%; top: 14%; width: 18%; }
    .canvas[data-format="square"] .date { right: 5.7%; top: 16.4%; width: 18.6%; }
    .canvas[data-format="square"] .party { top: 68.5%; }
    .canvas[data-format="square"] .venue { top: 80%; font-size: 2.35cqw; }
    .canvas[data-format="square"] .dj-lineup { top: 84%; font-size: 2.2cqw; }
    .canvas[data-format="square"] .fine-print { top: 88.1%; font-size: 1.5cqw; }
    .canvas[data-format="square"] .brand-row { top: 92.2%; height: 5%; }
  </style>
</head>
<body>
  <main class="canvas" data-coco-canvas data-format="story">
    <div class="background" data-coco-object="background" data-coco-kind="shape" data-coco-asset="background" data-coco-editable="false"></div>
    <div class="ambience" data-coco-object="ambience" data-coco-kind="shape" data-coco-editable="false"></div>
    <div class="constellations" data-coco-object="constellations" data-coco-kind="shape" data-coco-editable="true"></div>
    <div class="edge-bar left" data-coco-object="edge-bar-left" data-coco-kind="shape" data-coco-editable="true"></div>
    <div class="edge-bar right" data-coco-object="edge-bar-right" data-coco-kind="shape" data-coco-editable="true"></div>
    <svg class="portrait-frame" width="100%" height="100%" viewBox="0 0 100 160" preserveAspectRatio="none" style="display:block;overflow:visible" data-coco-object="portrait-frame" data-coco-kind="svg" data-coco-editable="true" aria-hidden="true">
      <defs>
        <linearGradient id="black-gold-frame-foil" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#855000"/><stop offset=".16" stop-color="#fff5a8"/>
          <stop offset=".36" stop-color="#e89c00"/><stop offset=".54" stop-color="#fff0a0"/>
          <stop offset=".78" stop-color="#a85800"/><stop offset="1" stop-color="#ffc83e"/>
        </linearGradient>
      </defs>
      <rect x="3" y="3" width="94" height="154" fill="rgba(0,0,0,.08)" stroke="url(#black-gold-frame-foil)" stroke-width="6"/>
      <rect x="5" y="5" width="90" height="150" fill="none" stroke="rgba(255,248,177,.72)" stroke-width=".8"/>
    </svg>
    <div class="smoke" data-coco-object="smoke" data-coco-kind="shape" data-coco-editable="true"></div>
    <img class="subject" src="/generated-flyers/assets/black-gold-party-subject-v1.png" alt="Black and gold portrait" data-coco-object="subject" data-coco-kind="image" data-coco-role="subject" data-coco-asset="subject" data-coco-editable="true" />
    <img class="shards" src="/generated-flyers/assets/black-gold-party-shards-v1.png" alt="Shattered glass" data-coco-object="shards" data-coco-kind="texture" data-coco-asset="shards" data-coco-editable="true" />

    <div class="presenter" data-coco-object="presenter" data-coco-kind="text" data-coco-role="presenter" data-coco-editable="true">REDSANITY CLUB PRESENTS</div>
    <div class="headline metallic-text" data-coco-object="headline" data-coco-kind="text" data-coco-role="headline" data-coco-editable="true">BLACK</div>
    <div class="headline2 metallic-text" data-coco-object="headline2" data-coco-kind="text" data-coco-role="headline2" data-coco-editable="true">GOLD</div>

    <div class="date-medallion" data-coco-object="date-medallion" data-coco-kind="shape" data-coco-editable="true"></div>
    <div class="date" data-coco-object="date" data-coco-kind="text" data-coco-role="date" data-coco-editable="true"><span class="month">JUNE</span> <span class="day">18</span></div>
    <div class="party" data-coco-object="party" data-coco-kind="text" data-coco-role="subtag" data-coco-editable="true">PARTY</div>

    <div class="venue" data-coco-object="venue" data-coco-kind="text" data-coco-role="venue" data-coco-editable="true">BLAST ELECTRO BAR | NY</div>
    <div class="dj-lineup" data-coco-object="dj-lineup" data-coco-kind="text" data-coco-role="djLineup" data-coco-editable="true">DJ JERIAN &amp; DJ DARABELLA</div>
    <div class="fine-print">
      <span data-coco-object="time" data-coco-kind="text" data-coco-role="time" data-coco-editable="true">STARTS AT 7PM</span>
      <span class="separator">|</span>
      <span data-coco-object="details" data-coco-kind="text" data-coco-role="details" data-coco-editable="true">FREE PARKING | FREE FOR LADIES</span>
      <span class="separator">|</span>
      <span data-coco-object="price" data-coco-kind="text" data-coco-role="price" data-coco-editable="true">ENTRY $12</span>
    </div>

    <div class="brand-row">
      <svg class="brand one" width="100%" height="100%" viewBox="0 0 220 70" style="display:block;overflow:visible" data-coco-object="brand-one" data-coco-kind="svg" data-coco-editable="true" aria-label="Awesome Flyers logo">
        <defs><linearGradient id="brand-one-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#73652f"/><stop offset=".48" stop-color="#e2cc77"/><stop offset="1" stop-color="#8a7430"/></linearGradient></defs>
        <text x="110" y="34" text-anchor="middle" fill="url(#brand-one-gold)" font-family="GoldSansBold, sans-serif" font-size="27" font-style="italic" font-weight="900">AWESOME</text>
        <text x="112" y="57" text-anchor="middle" fill="#a99546" font-family="GoldSans, sans-serif" font-size="15" letter-spacing="8">FLYERS</text>
      </svg>
      <svg class="brand two" width="100%" height="100%" viewBox="0 0 240 70" style="display:block;overflow:visible" data-coco-object="brand-two" data-coco-kind="svg" data-coco-editable="true" aria-label="Redsanification logo">
        <defs><linearGradient id="brand-two-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77642b"/><stop offset=".5" stop-color="#dbc46c"/><stop offset="1" stop-color="#8b7430"/></linearGradient></defs>
        <text x="120" y="47" text-anchor="middle" fill="url(#brand-two-gold)" font-family="GoldBrush, cursive" font-size="34" font-style="italic">Redsanification</text>
      </svg>
      <svg class="brand three" width="100%" height="100%" viewBox="0 0 200 70" style="display:block;overflow:visible" data-coco-object="brand-three" data-coco-kind="svg" data-coco-editable="true" aria-label="Club logo">
        <defs><linearGradient id="brand-three-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77642b"/><stop offset=".48" stop-color="#e1cc78"/><stop offset="1" stop-color="#86702e"/></linearGradient></defs>
        <text x="100" y="48" text-anchor="middle" fill="url(#brand-three-gold)" font-family="GoldDisplay, sans-serif" font-size="37" font-weight="900" letter-spacing="-2">CLUBLOGO</text>
      </svg>
    </div>
    <div class="grain" data-coco-object="grain" data-coco-kind="shape" data-coco-editable="false"></div>
  </main>
  <script>
    const format = new URLSearchParams(location.search).get("format");
    const canvas = document.querySelector("[data-coco-canvas]");
    canvas.dataset.format = format === "square" ? "square" : "story";
    document.querySelectorAll("[data-coco-object]").forEach((node) => {
      node.dataset.region = node.dataset.cocoObject;
    });
  </script>
</body>
</html>
